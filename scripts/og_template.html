<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Tiro+Devanagari+Hindi&family=Montserrat:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #faf6f0;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2c241e;
    }

    /* Jaali background watermark */
    .jaali-bg {
      position: absolute;
      inset: 0;
      background-image: url('/src/assets/jaali.jpg');
      background-size: 320px;
      opacity: 0.08;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Outer golden double border */
    .border-outer {
      position: absolute;
      inset: 16px;
      border: 2px solid #c89b3c;
      pointer-events: none;
    }
    .border-inner {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(200, 155, 60, 0.45);
      pointer-events: none;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #c89b3c;
      border-style: solid;
      pointer-events: none;
    }
    .tl { top: 26px; left: 26px; border-width: 3px 0 0 3px; }
    .tr { top: 26px; right: 26px; border-width: 3px 3px 0 0; }
    .bl { bottom: 26px; left: 26px; border-width: 0 0 3px 3px; }
    .br { bottom: 26px; right: 26px; border-width: 0 3px 3px 0; }

    .card-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 58% 42%;
      padding: 38px 45px;
      align-items: center;
    }

    /* Left Side: Wedding Announcement Details */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-right: 25px;
    }

    .shloka {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 23px;
      color: #b38226;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .shloka-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .shloka-divider .line {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c89b3c, transparent);
    }
    .shloka-divider .diamond {
      width: 6px;
      height: 6px;
      background: #c89b3c;
      transform: rotate(45deg);
    }

    .kicker {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.38em;
      color: #7d7265;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .names-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 14px;
      margin: 4px 0 10px;
    }

    .couple-name {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      font-weight: 700;
      color: #1e382b; /* Pine green */
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .weds-italic {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-style: italic;
      color: #c89b3c;
      font-weight: 400;
    }

    .gold-divider {
      width: 240px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c89b3c 20%, #e8c874 50%, #c89b3c 80%, transparent);
      margin: 6px auto 18px;
      position: relative;
    }
    .gold-divider::after {
      content: '✦';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #c89b3c;
      font-size: 11px;
      background: #faf6f0;
      padding: 0 6px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #c89b3c;
      background: rgba(239, 232, 219, 0.75);
      padding: 10px 32px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(200, 155, 60, 0.12);
      margin-bottom: 16px;
    }

    .date-text {
      font-family: 'Cinzel', serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #1e382b;
      text-transform: uppercase;
    }

    .venue-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #4a4036;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .venue-address {
      font-size: 12.5px;
      letter-spacing: 0.05em;
      color: #6e6459;
      line-height: 1.4;
    }

    .cordial-note {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13.5px;
      color: #8c7e6c;
      margin-top: 14px;
      letter-spacing: 0.03em;
    }

    /* Right Side: Mughal Arch Portrait */
    .right-panel {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arch-frame {
      position: relative;
      width: 410px;
      height: 520px;
      border-top-left-radius: 205px;
      border-top-right-radius: 205px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px -10px rgba(30, 56, 43, 0.35), 0 0 0 4px #c89b3c, 0 0 0 8px rgba(200, 155, 60, 0.3);
      background: #e7dfd1;
    }

    .arch-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 32%;
      transform: scale(1.04);
    }

    /* Subtle bottom gradient inside arch */
    .arch-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 65%, rgba(30, 56, 43, 0.4) 100%);
      pointer-events: none;
    }

    .lotus-dec-left {
      position: absolute;
      bottom: -4px;
      left: 10px;
      width: 85px;
      height: auto;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
      z-index: 20;
    }
    .lotus-dec-right {
      position: absolute;
      bottom: -4px;
      right: 10px;
      width: 85px;
      height: auto;
      transform: scaleX(-1);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="jaali-bg"></div>
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="card-content">
    <div class="left-panel">
      <div class="shloka">॥ श्री गणेशाय नमः ॥</div>
      <div class="shloka-divider">
        <div class="line"></div>
        <div class="diamond"></div>
        <div class="line"></div>
      </div>

      <div class="kicker">Wedding Invitation</div>

      <div class="names-container">
        <span class="couple-name">Sonali</span>
        <span class="weds-italic">weds</span>
        <span class="couple-name">Abhishek</span>
      </div>

      <div class="gold-divider"></div>

      <div class="date-badge">
        <span class="date-text">Tuesday • 3rd November 2026</span>
      </div>

      <div class="venue-title">At Our Residence • Vill. Kuranwala</div>
      <div class="venue-address">P.O. Mandhala, Tehsil Baddi, Distt. Solan (H.P.)</div>

      <div class="cordial-note">Request the honour of your presence & blessings</div>
    </div>

    <div class="right-panel">
      <div class="arch-frame">
        <img src="/src/assets/hero-arch.jpg" alt="Sonali and Abhishek">
      </div>
      <img src="/src/assets/lotus.png" class="lotus-dec-left" alt="Lotus">
      <img src="/src/assets/lotus.png" class="lotus-dec-right" alt="Lotus">
    </div>
  </div>
</body>
</html>
